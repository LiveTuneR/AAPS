name: Apex test build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      buildVariant:
        type: string
        default: fullRelease

permissions:
  contents: read

concurrency:
  group: apex-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate build variant
        env:
          BUILD_VARIANT: ${{ inputs.buildVariant || 'fullRelease' }}
        run: test "$BUILD_VARIANT" = fullRelease

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle
        run: chmod +x gradlew

      - name: Test reliability and diagnostic modules
        env:
          APEX7_CAPTURE_SCREENSHOTS: 'true'
        run: |
          ./gradlew :workflow:testFullDebugUnitTest :plugins:main:testFullDebugUnitTest \
            :plugins:sensitivity:testFullDebugUnitTest :core:interfaces:testFullDebugUnitTest \
            :plugins:sync:testFullDebugUnitTest :pump:apex:testFullDebugUnitTest :core:data:test \
            :ui:testFullDebugUnitTest --tests '*EnhancedOverviewContentTest' --tests '*ActivityEventCodecTest' \
            --no-daemon --max-workers=2 --console=plain -I doc/apex7-validation.init.gradle \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Xss1m"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex7-tests-${{ github.run_number }}
          path: |
            workflow/build/test-results/**/*.xml
            plugins/*/build/test-results/**/*.xml
            core/*/build/test-results/**/*.xml
            pump/apex/build/test-results/**/*.xml
            ui/build/test-results/**/*.xml
            ui/build/reports/apex7-screenshots/*.png
          retention-days: 14

      - name: Decode signing key
        shell: bash
        env:
          KEYSTORE_SET: ${{ secrets.KEYSTORE_SET }}
          KEYSTORE_BASE64_SECRET: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -n "$KEYSTORE_SET" ]]; then
            decoded=$(printf '%s' "$KEYSTORE_SET" | base64 --decode)
            keystore_base64=$(printf '%s' "$decoded" | cut -d'|' -f1)
            keystore_password=$(printf '%s' "$decoded" | cut -d'|' -f2)
            key_alias=$(printf '%s' "$decoded" | cut -d'|' -f3)
            key_password=$(printf '%s' "$decoded" | cut -d'|' -f4)
          else
            keystore_base64="$KEYSTORE_BASE64_SECRET"
            keystore_password="$KEYSTORE_PASSWORD_SECRET"
            key_alias="$KEY_ALIAS_SECRET"
            key_password="$KEY_PASSWORD_SECRET"
          fi
          for value in "$keystore_base64" "$keystore_password" "$key_alias" "$key_password"; do
            [[ -n "$value" ]] || { echo "Signing secret is missing"; exit 1; }
            echo "::add-mask::$value"
          done
          mkdir -p "$RUNNER_TEMP/apex-signing"
          printf '%s' "$keystore_base64" | base64 --decode > "$RUNNER_TEMP/apex-signing/keystore.jks"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/apex-signing/keystore.jks"
            echo "KEYSTORE_PASSWORD=$keystore_password"
            echo "KEY_ALIAS=$key_alias"
            echo "KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"

      - name: Build signed APK
        run: |
          ./gradlew :app:assembleFullRelease --no-daemon --max-workers=2 --console=plain \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC -Xss1m" \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/full/release -maxdepth 1 -name '*.apk' -type f | head -n 1)
          [[ -n "$apk" ]] || { echo "APK was not produced"; exit 1; }
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$apksigner" verify --verbose --print-certs "$apk"
          short_sha=${GITHUB_SHA:0:7}
          output="aaps-4.0-apex-$short_sha.apk"
          cp "$apk" "$output"
          sha256sum "$output" > "$output.sha256"
          printf 'commit=%s\nrun=%s\nstatus=EXPERIMENTAL_NOT_DEVICE_VALIDATED\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$output.provenance.txt"
          echo "APK_OUTPUT=$output" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: aaps-4.0-apex-${{ github.run_number }}
          path: |
            ${{ env.APK_OUTPUT }}
            ${{ env.APK_OUTPUT }}.sha256
            ${{ env.APK_OUTPUT }}.provenance.txt
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/apex-signing/keystore.jks"
