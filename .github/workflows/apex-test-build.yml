name: Apex test build

on:
  push:
    branches: [codex/energy-r1-2026-10-06, codex/energy-r1_1-2026-10-06]
  workflow_dispatch:
  workflow_call:
    inputs:
      buildVariant:
        type: string
        default: fullRelease

permissions:
  contents: read
concurrency:
  group: apex-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate build variant
        env:
          BUILD_VARIANT: ${{ inputs.buildVariant || 'fullRelease' }}
        run: test "$BUILD_VARIANT" = fullRelease
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: false
      - name: Prepare Gradle
        run: chmod +x gradlew
      - name: Test reliability and energy modules
        env:
          APEX7_CAPTURE_SCREENSHOTS: 'true'
        run: |
          ./gradlew :workflow:testFullDebugUnitTest :plugins:main:testFullDebugUnitTest \
            :plugins:sensitivity:testFullDebugUnitTest :core:interfaces:testFullDebugUnitTest \
            :plugins:sync:testFullDebugUnitTest :pump:apex:testFullDebugUnitTest :core:data:test \
            :pump:medtrum:testFullDebugUnitTest :plugins:aps:testFullDebugUnitTest \
            :plugins:smoothing:testFullDebugUnitTest :implementation:testFullDebugUnitTest \
            :shared:impl:testFullDebugUnitTest :ui:testFullDebugUnitTest :wear:testFullDebugUnitTest \
            :database:impl:testFullDebugUnitTest :database:persistence:testFullDebugUnitTest \
            --no-daemon --max-workers=2 --console=plain -I doc/apex7-validation.init.gradle \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Xss1m"
      - name: Profile synthetic SQL fixture
        run: python3 doc/performance/measure_energy_fixture.py --output build/reports/energy-fixtures/sql-fixture.json
      - name: Verify protected therapy sources
        run: python3 doc/performance/verify_energy_invariants.py --output build/reports/energy-fixtures/therapy-source-invariants.json
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apex7-tests-${{ github.run_number }}
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/energy-fixtures/*.json
            ui/build/reports/apex7-screenshots/*.png
            ui/build/reports/tests/**
            doc/performance/metrics/*.json
            doc/APEX7_BOLUS_BASELINE.md
            doc/APEX_BOLUS_DEVICE_ACCEPTANCE_RU.md
            pump/apex/src/test/resources/apex/incidents/*.json
          retention-days: 30
      - name: Build unsigned Phone and Wear APKs
        run: |
          ./gradlew :app:assembleFullRelease :wear:assembleFullRelease --no-daemon --max-workers=2 --console=plain \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC -Xss1m"
          mkdir -p unsigned
          cp app/build/outputs/apk/full/release/*-unsigned.apk unsigned/phone-unsigned.apk
          cp wear/build/outputs/apk/full/release/*-unsigned.apk unsigned/wear-unsigned.apk
          printf '%s\n' "$GITHUB_SHA" > unsigned/source-sha.txt
          sha256sum unsigned/*.apk > unsigned/sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: energy-unsigned-${{ github.run_number }}
          path: unsigned/
          if-no-files-found: error
          retention-days: 3

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Fresh runner: no Gradle or repository build process ever receives the signing secrets.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: energy-unsigned-${{ github.run_number }}
          path: unsigned
      - name: Validate unsigned provenance
        run: |
          test "$(cat unsigned/source-sha.txt)" = "$GITHUB_SHA"
          sha256sum -c unsigned/sha256.txt
      - name: Sign APK pair with existing key
        shell: bash
        env:
          KEYSTORE_SET: ${{ secrets.KEYSTORE_SET }}
          KEYSTORE_BASE64_SECRET: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          signing_dir="$RUNNER_TEMP/apex-signing"
          mkdir -p "$signing_dir"
          trap 'rm -f -- "$signing_dir/keystore.jks"' EXIT
          if [[ -n "$KEYSTORE_SET" ]]; then
            decoded=$(printf '%s' "$KEYSTORE_SET" | base64 --decode)
            IFS='|' read -r keystore_base64 SIGN_STORE_PASS SIGN_ALIAS SIGN_KEY_PASS <<< "$decoded"
          else
            keystore_base64="$KEYSTORE_BASE64_SECRET"
            SIGN_STORE_PASS="$KEYSTORE_PASSWORD_SECRET"
            SIGN_ALIAS="$KEY_ALIAS_SECRET"
            SIGN_KEY_PASS="$KEY_PASSWORD_SECRET"
          fi
          for value in "$keystore_base64" "$SIGN_STORE_PASS" "$SIGN_ALIAS" "$SIGN_KEY_PASS"; do
            [[ -n "$value" ]] || { echo "Signing secret is missing"; exit 1; }
            echo "::add-mask::$value"
          done
          export SIGN_STORE_PASS SIGN_KEY_PASS
          printf '%s' "$keystore_base64" | base64 --decode > "$signing_dir/keystore.jks"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          mkdir -p signed
          short_sha=${GITHUB_SHA:0:7}
          for spec in "phone:unsigned/phone-unsigned.apk:aaps-4.0-apex-$short_sha.apk" "wear:unsigned/wear-unsigned.apk:aaps-4.0-apex-wear-$short_sha.apk"; do
            kind=${spec%%:*}; rest=${spec#*:}; apk=${rest%%:*}; output=${rest#*:}
            "$apksigner" sign --ks "$signing_dir/keystore.jks" --ks-key-alias "$SIGN_ALIAS" \
              --ks-pass env:SIGN_STORE_PASS --key-pass env:SIGN_KEY_PASS --out "signed/$output" "$apk"
          done
      - name: Verify signed upgrade identity and embedded source
        shell: bash
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1 | xargs dirname)
          short_sha=${GITHUB_SHA:0:7}
          python3 doc/performance/verify_apk_pair.py \
            --phone "signed/aaps-4.0-apex-$short_sha.apk" --wear "signed/aaps-4.0-apex-wear-$short_sha.apk" \
            --build-tools "$build_tools" --commit "$GITHUB_SHA" --output signed/apk-verification.json
          apksigner="$build_tools/apksigner"
          for apk in signed/*.apk; do
            "$apksigner" verify --verbose --print-certs "$apk" > "$apk.signature.txt"
            sha256sum "$apk" > "$apk.sha256"
            printf 'commit=%s\nrun=%s\nstatus=EXPERIMENTAL_DEVICE_VALIDATION_REQUIRED\n' \
              "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$apk.provenance.txt"
          done
          echo 'Phone and Wear signed and verified; device upgrade and energy measurements pending.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aaps-4.0-apex-${{ github.run_number }}
          path: signed/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/apex-signing/keystore.jks"

  drive-delivery:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: aaps-4.0-apex-${{ github.run_number }}
          path: signed
      - name: Locate signed pair
        run: |
          short_sha=${GITHUB_SHA:0:7}
          echo "APK_OUTPUT=signed/aaps-4.0-apex-$short_sha.apk" >> "$GITHUB_ENV"
          echo "WEAR_OUTPUT=signed/aaps-4.0-apex-wear-$short_sha.apk" >> "$GITHUB_ENV"

      - name: Upload signed phone and Wear APKs to Google Drive
        shell: bash
        env:
          GDRIVE_OAUTH2: ${{ secrets.GDRIVE_OAUTH2 }}
        run: |
          set -euo pipefail
          [[ -n "$GDRIVE_OAUTH2" ]] || { echo "GDRIVE_OAUTH2 secret is missing"; exit 1; }
          decoded=$(printf '%s' "$GDRIVE_OAUTH2" | base64 --decode)
          client_id=$(printf '%s' "$decoded" | cut -d'|' -f1)
          refresh_token=$(printf '%s' "$decoded" | cut -d'|' -f2)
          echo "::add-mask::$client_id"
          echo "::add-mask::$refresh_token"
          token_response=$(curl --fail-with-body -sS -X POST https://oauth2.googleapis.com/token \
            -d client_id="$client_id" -d refresh_token="$refresh_token" -d grant_type=refresh_token)
          access_token=$(jq -er '.access_token' <<<"$token_response")
          echo "::add-mask::$access_token"

          find_folder() {
            local name=$1 parent=${2:-}
            local query="name='$name' and mimeType='application/vnd.google-apps.folder' and trashed=false"
            [[ -z "$parent" ]] || query="$query and '$parent' in parents"
            curl --fail-with-body -sS -G -H "Authorization: Bearer $access_token" \
              --data-urlencode "q=$query" --data-urlencode 'fields=files(id)' \
              https://www.googleapis.com/drive/v3/files | jq -r '.files[0].id // empty'
          }
          create_folder() {
            local name=$1 parent=${2:-} metadata
            if [[ -n "$parent" ]]; then
              metadata=$(jq -nc --arg name "$name" --arg parent "$parent" \
                '{name:$name,mimeType:"application/vnd.google-apps.folder",parents:[$parent]}')
            else
              metadata=$(jq -nc --arg name "$name" '{name:$name,mimeType:"application/vnd.google-apps.folder"}')
            fi
            curl --fail-with-body -sS -X POST -H "Authorization: Bearer $access_token" \
              -H 'Content-Type: application/json' -d "$metadata" \
              'https://www.googleapis.com/drive/v3/files?fields=id' | jq -er '.id'
          }
          ensure_folder() {
            local name=$1 parent=${2:-} id
            id=$(find_folder "$name" "$parent")
            [[ -n "$id" ]] || id=$(create_folder "$name" "$parent")
            printf '%s' "$id"
          }
          upload_file() {
            local file=$1 parent=$2 name id query metadata method url
            name=$(basename "$file")
            query="name='$name' and '$parent' in parents and trashed=false"
            id=$(curl --fail-with-body -sS -G -H "Authorization: Bearer $access_token" \
              --data-urlencode "q=$query" --data-urlencode 'fields=files(id)' \
              https://www.googleapis.com/drive/v3/files | jq -r '.files[0].id // empty')
            metadata=$(jq -nc --arg name "$name" --arg parent "$parent" '{name:$name,parents:[$parent]}')
            if [[ -n "$id" ]]; then
              method=PATCH
              url="https://www.googleapis.com/upload/drive/v3/files/$id?uploadType=multipart&fields=id,name"
              metadata=$(jq -nc --arg name "$name" '{name:$name}')
            else
              method=POST
              url='https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name'
            fi
            curl --fail-with-body -sS -X "$method" -H "Authorization: Bearer $access_token" \
              -F "metadata=$metadata;type=application/json;charset=UTF-8" \
              -F "file=@$file;type=application/octet-stream" "$url" | jq -e '.id and .name' >/dev/null
          }

          root_id=$(ensure_folder AAPS)
          apex_id=$(ensure_folder Apex7 "$root_id")
          short_sha=${GITHUB_SHA:0:7}
          release_id=$(ensure_folder "$short_sha" "$apex_id")
          for file in "$APK_OUTPUT" "$APK_OUTPUT.sha256" "$APK_OUTPUT.signature.txt" "$APK_OUTPUT.provenance.txt" \
                      "$WEAR_OUTPUT" "$WEAR_OUTPUT.sha256" "$WEAR_OUTPUT.signature.txt" "$WEAR_OUTPUT.provenance.txt" signed/apk-verification.json; do
            upload_file "$file" "$release_id"
          done
          echo "Google Drive folder: https://drive.google.com/drive/folders/$release_id" >> "$GITHUB_STEP_SUMMARY"
